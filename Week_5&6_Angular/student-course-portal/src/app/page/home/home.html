<div class="home-container">

  <h1>{{ portalName }}</h1>

  <p>
    Welcome to the Student Course Portal
  </p>


  <div class="stats">

    <div>
      <h2>{{ coursesCount }}</h2>
      <p>Courses Available</p>
    </div>


    <div>
      <h2>3</h2>
      <p>Enrolled</p>
    </div>


    <div>
      <h2>3.8</h2>
      <p>GPA</p>
    </div>

  </div>


  <button
    (click)="onEnrollClick()"
    [disabled]="!isPortalActive">

    Enroll Now

  </button>


  <p>
    {{ message }}
  </p>


  <br>


  <input
    type="text"
    [(ngModel)]="searchTerm"
    placeholder="Search courses">


  <p>
    Searching for: {{ searchTerm }}
  </p>


  <hr>


  <app-course-summary-widget></app-course-summary-widget>


</div>
<app-notification></app-notification>
